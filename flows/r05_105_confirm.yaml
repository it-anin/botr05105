# กดปุ่ม "ตกลง" ในหน้าต่างเงื่อนไขการสร้างรายงาน เพื่อออกรายงาน R05.105 จริง
#
# เงื่อนไขที่ตั้งไว้: สินค้าทั้งหมด (ค่าเริ่มต้นของหน้าต่างเงื่อนไข ไม่ได้แตะ - มีแค่
# ตัวเลือกเดียวคือ "สร้างรายงานตาม สินค้า": สินค้าทั้งหมด / กลุ่มสินค้า / สินค้า)
#
# ปุ่มในหน้าต่างเงื่อนไข
#     { class_name: "Button", title: "ตกลง" }   ยืนยัน
#     { class_name: "Button", title: "ออก" }    ยกเลิก

name: r05_105_confirm
description: กดตกลงในหน้าเงื่อนไข (สินค้าทั้งหมด) เพื่อออกรายงาน R05.105
on_error: abort

steps:
  - action: run_flow
    name: เปิดหน้าต่างเงื่อนไข
    path: flows/r05_105_generate.yaml

  - action: wait_window
    name: จับหน้าจอหลักไว้อ้างอิง
    as: main
    timeout: 60
    window:
      class_name: "FNWND3125"
      title: "Report Seniorsoft ProMaxx"

  - action: wait_window
    name: จับหน้าต่างเงื่อนไขไว้อ้างอิง
    as: cond
    timeout: 60
    window:
      class_name: "FNWNS3125"
      title: "เงื่อนไขการสร้างรายงาน"

  - action: click
    name: กดปุ่มตกลง
    window: cond
    control: { class_name: "Button", title: "ตกลง" }
    method: message

  - action: wait_window_gone
    name: รอหน้าต่างเงื่อนไขปิด
    window: cond
    timeout: 60
    abort_if: { class_name: "#32770" }

  # สัญญาณว่ารายงานออกเสร็จจริง: แถบสรุปเงื่อนไขใต้รายงาน (Edit id=1004) โผล่พร้อมข้อความ
  - action: wait_control
    name: รอจนรายงานออกเสร็จ (แถบสรุปเงื่อนไขใต้รายงานโผล่)
    window: main
    control: { class_name: "Edit", control_id: 1004 }
    state: visible
    timeout: 600

  - action: screenshot
    name: 01_report_result
    window: main

  - action: dump_tree
    name: ดูโครงสร้างหลังรายงานออก (อ่านข้อความ Edit 1004 จริง)
    window: main
